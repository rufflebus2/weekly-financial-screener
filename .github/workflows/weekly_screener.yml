name: Weekly Financial Screener

on:
  schedule:
    # Runs at 14:30 UTC every Monday (9:30 AM Eastern Standard Time)
    - cron: '30 14 * * 1'
  workflow_dispatch: 

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recreate GCP Service Account Key File securely
        run: echo '${{ secrets.GCP_SA_KEY }}' > service-account.key.json

      - name: Run Screener Script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: "asia-southeast1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener.py
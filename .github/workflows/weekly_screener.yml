name: Weekly Signal Screener

on:
  schedule:
    # Mondays, shortly after the US market open.
    # GitHub Actions cron is UTC-only and does NOT handle daylight saving:
    #   - Nov-Mar (EST): 14:35 UTC = 9:35 AM ET
    #   - Mar-Nov (EDT): 14:35 UTC = 10:35 AM ET
    # For a weekly swing signal either is fine; the slight delay after open also
    # lets the first daily bar of the session exist for the holiday check.
    - cron: "35 14 * * 1"
    # Optional: Friday run to review open positions / exits before the weekend.
    # Uncomment to enable (adds a second weekly alert).
    # - cron: "35 20 * * 5"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: weekly-signals
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # Gemini auth via Vertex AI (required in regions without AI Studio /
          # API-key support, e.g. Hong Kong). The service account JSON is pasted
          # whole into the GOOGLE_APPLICATION_CREDENTIALS_JSON secret; the script
          # writes it to a temp file for Application Default Credentials.
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          # Alternative for supported regions only:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional — define as repo Variables (Settings > Secrets and variables > Actions)
          WATCHLIST: ${{ vars.WATCHLIST }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ACCOUNT_SIZE: ${{ secrets.ACCOUNT_SIZE }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
        run: python main-two.py
